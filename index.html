<!--
  AGRIVITRO — "Download All Data" button
  ---------------------------------------
  Drop this block into your existing dashboard page (overlord593.github.io/agrivitro-dashboard).
  It queries InfluxDB Cloud for everything ever stored (range(start: 0)) and
  downloads it as a CSV file in the browser.

  BEFORE USING:
  1. Fill in INFLUX_URL, INFLUX_ORG, INFLUX_BUCKET, INFLUX_TOKEN below.
  2. Use a READ-ONLY InfluxDB token here — this runs client-side, so anyone
     viewing page source can see it. A read-only token limits the damage
     if it leaks.
-->

<!-- ============ HTML ============ -->
<button id="downloadDataBtn" class="download-btn">
  ⬇ Download All Data
</button>

<!-- ============ CSS ============ -->
<style>
  .download-btn {
    padding: 10px 18px;
    background: #2e7d32;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    font-family: inherit;
    transition: background 0.2s ease;
  }
  .download-btn:hover:not(:disabled) {
    background: #256428;
  }
  .download-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
</style>

<!-- ============ JS ============ -->
<script>
  // --- Configure these to match your existing InfluxDB Cloud setup ---
  const INFLUX_URL    = "https://YOUR-REGION.aws.cloud2.influxdata.com";
  const INFLUX_ORG    = "USMBA";        // your InfluxDB org
  const INFLUX_BUCKET = "agrivitro";    // your bucket name
  const INFLUX_TOKEN  = "YOUR_READ_ONLY_TOKEN";

  document.getElementById("downloadDataBtn").addEventListener("click", downloadAllData);

  async function downloadAllData() {
    const btn = document.getElementById("downloadDataBtn");
    const originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = "Preparing download...";

    // Flux query: pull every record from the start of time in the bucket,
    // pivoted so each row = one timestamp with all sensor fields as columns.
    const fluxQuery = `
      from(bucket: "${INFLUX_BUCKET}")
        |> range(start: 0)
        |> pivot(rowKey:["_time"], columnKey: ["_field"], valueColumn: "_value")
        |> sort(columns: ["_time"])
    `;

    try {
      const response = await fetch(`${INFLUX_URL}/api/v2/query?org=${INFLUX_ORG}`, {
        method: "POST",
        headers: {
          "Authorization": `Token ${INFLUX_TOKEN}`,
          "Content-Type": "application/vnd.flux",
          "Accept": "application/csv"
        },
        body: fluxQuery
      });

      if (!response.ok) {
        throw new Error(`InfluxDB query failed: ${response.status} ${response.statusText}`);
      }

      const csvText = await response.text();

      if (!csvText || csvText.trim().length === 0) {
        alert("No data found in the bucket.");
        return;
      }

      // Trigger a browser download of the CSV
      const blob = new Blob([csvText], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const timestamp = new Date().toISOString().split("T")[0];
      a.href = url;
      a.download = `agrivitro_all_data_${timestamp}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

    } catch (err) {
      console.error("Download failed:", err);
      alert("Couldn't download data. Check the browser console for details.");
    } finally {
      btn.disabled = false;
      btn.textContent = originalText;
    }
  }
</script>
